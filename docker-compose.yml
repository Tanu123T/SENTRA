services:

  postgres:
    image: postgis/postgis:16-3.4
    container_name: sentra-postgres

    environment:
      POSTGRES_DB: sentra_db
      POSTGRES_USER: sentra_user
      POSTGRES_PASSWORD: sentra_password
    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: sentra-backend

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+asyncpg://sentra_user:sentra_password@postgres:5432/sentra_db

    depends_on:
      - postgres

    restart: unless-stopped


volumes:
  postgres_data: